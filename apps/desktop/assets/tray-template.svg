<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44" fill="none">
  <!-- Padded to 16x16pt (32x32px) inside 22x22pt (44x44px) status bar frame -->
  <g transform="translate(21 21)">
    <!-- Outer Search & Compass Ring -->
    <circle cx="0" cy="0" r="12.2" stroke="#000000" stroke-width="2.4" />

    <!-- Search Launcher Handle (SE 45 deg) -->
    <line x1="10.4" y1="10.4" x2="13.8" y2="13.8" stroke="#000000" stroke-width="2.6" stroke-linecap="round" />

    <!-- Command-Split Sinan Needle (NE 45 deg) -->
    <g transform="rotate(45)">
      <!-- North Launch Tip (Solid Black) -->
      <path d="M 0 -9.8 L -4.3 0.8 L 0 -1.5 L 4.3 0.8 Z" fill="#000000" />
      <!-- South Command Tail (Translucent Black for Two-Tone Depth in Template Mode) -->
      <path d="M -3.6 2.5 L 0 0.5 L 3.6 2.5 L 0 9.8 Z" fill="#000000" fill-opacity="0.48" />
    </g>
  </g>
</svg>
