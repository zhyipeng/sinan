name: Reusable desktop build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: darwin, arch: arm64}
          - {os: macos-15-intel, platform: darwin, arch: x64}
          - {os: windows-2022, platform: win32, arch: x64}
          - {os: windows-11-arm, platform: win32, arch: arm64}
          - {os: ubuntu-24.04, platform: linux, arch: x64}
          - {os: ubuntu-24.04-arm, platform: linux, arch: arm64}
    runs-on: ${{ matrix.os }}
    env:
      SINAN_NATIVE_UI_TEST: '0'
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-ci' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - name: Linux native development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev
      - name: Install pinned Wails CLI
        if: runner.os != 'Linux'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Install pinned Wails CLI with GTK3
        if: runner.os == 'Linux'
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - run: node scripts/desktop.mjs setup
      - name: Verify native architecture and release tooling
        run: |
          node scripts/release.mjs validate ${{ matrix.platform }} ${{ matrix.arch }}
          node --test scripts/release.test.mjs
      - run: node scripts/desktop.mjs package
      - name: macOS and Linux headless regression
        if: runner.os != 'Windows'
        run: node scripts/desktop.mjs test
      # Legacy integration fixtures still assume POSIX permissions and links.
      - name: Windows platform regression
        if: runner.os == 'Windows'
        run: go test ./plugins/system-app-search/catalog ./internal/plugin/manifest ./internal/plugin/transport ./internal/plugin/uihost ./apps/desktop -run 'TestPlatform|TestDesktop|TestNativeBridge|TestEmbeddedResource|TestWebview|TestBundled|TestHiddenCommands|TestWindowCommand|TestImport|TestCollectPNG'
      - name: Windows frontend regression
        if: runner.os == 'Windows'
        run: |
          node --test packages/plugin-sdk/theme/runtime.test.mjs
          node --test internal/plugin/uihost/gtk_bridge.test.mjs internal/plugin/uihost/webview_bridge.test.mjs
          node --experimental-strip-types --test apps/desktop/frontend/tests/paste.test.mjs apps/desktop/frontend/tests/searchKeyboard.test.mjs
      - name: Windows host preferences and clipboard authority regression
        if: runner.os == 'Windows'
        run: go test ./internal/kernel -run '^TestSearchPreferences|^TestStartupPreferences|^TestWindowOpacityPreferences|^TestRetentionPreferences|^TestClipboardAuthority|^TestImageOutput|^TestWindowCommands'
      - name: Windows session image validation
        if: runner.os == 'Windows'
        run: go test ./internal/plugin/uiview -run '^TestImageSnapshot|^TestClipboardCall|^TestWindowExecution|^TestImageOutputBridge'
      - name: Windows catalog host version regression
        if: runner.os == 'Windows'
        run: go test ./plugins/system-plugin-manager/catalog -run '^TestPlatformCatalogHostVersion'
      - name: Windows plugin installation tasks and download progress
        if: runner.os == 'Windows'
        run: go test ./plugins/system-plugin-manager/catalog ./internal/plugin/distribution -run '^TestInstallTask|^TestDownloadProgress'
      - name: Clipboard and platform validation without desktop access
        if: runner.os == 'Windows'
        run: go test ./internal/clipboard ./internal/platform
      - name: Windows host update regression
        if: runner.os == 'Windows'
        run: go test ./internal/buildinfo ./internal/hostupdate ./plugins/system-settings/update
      - name: Archive portable package
        run: node scripts/release.mjs archive
      - name: Upload package artifact
        id: upload
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
      # upload-artifact already retries its own requests five times; this outer
      # attempt rescues longer ArtifactService outages (CreateArtifact timeouts).
      - name: Retry package artifact upload
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true
