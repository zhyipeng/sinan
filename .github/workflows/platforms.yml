name: Desktop platform builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      SINAN_NATIVE_UI_TEST: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - name: Linux native development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - run: node scripts/desktop.mjs setup
      - run: node scripts/desktop.mjs build
      - name: macOS and Linux headless regression
        if: runner.os != 'Windows'
        run: node scripts/desktop.mjs test
      # Legacy integration fixtures assume POSIX executable permissions and links.
      # Keep their Windows migration explicit, while exercising the new adapters.
      - name: Windows platform regression
        if: runner.os == 'Windows'
        run: go test ./plugins/system-app-search/catalog ./internal/plugin/manifest ./internal/plugin/transport ./internal/plugin/uihost -run 'TestPlatform|TestDesktop|TestNativeBridge|TestEmbeddedResource'
      - name: Windows frontend regression
        if: runner.os == 'Windows'
        run: |
          node --test packages/plugin-sdk/theme/runtime.test.mjs
          node --test internal/plugin/uihost/gtk_bridge.test.mjs
          node --experimental-strip-types --test apps/desktop/frontend/tests/paste.test.mjs
